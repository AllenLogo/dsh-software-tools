# 本仓库是单包插件，不需要 pnpm workspace 配置。
#
# 2026-11-08：删除了整段 `minimumReleaseAgeExclude` —— 它是 0.2.0-rc.1 时代
# 55 行供应链白名单，依赖已升级到 0.2.2-rc.1 后整份清单过期且会误导。
# 本机 minimumReleaseAge 未启用，因此不需要白名单；若将来重新启用，请按**当前**
# 已安装版本重新生成，而不是沿用旧清单：
#   pnpm config set minimumReleaseAge <minutes>
#   pnpm install   # 按报错把确实需要放行的 package@version 逐条加回 exclude
#
# 注意：这里以及仓库任何位置都不要写本机路径（`pnpm run check:local-config` 会拦）。
